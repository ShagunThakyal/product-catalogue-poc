services:
  backend:
    build: ./backend
    environment:
      PORT: 4000
      PRODUCT_API_BASE_URL: https://fakestoreapi.com
      FEATURED_PRODUCT_IDS: ${FEATURED_PRODUCT_IDS:-1,5,9,13,17}
      SALES_INBOX: ${SALES_INBOX:-sales@example.com}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Catalogue <no-reply@example.com>
    depends_on:
      - mailpit
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Local stand-in for the sales inbox: catches every email, no account needed. UI on :8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
